name: dbt build

# Proves the contract: every push/PR runs `dbt build` (seed + run + test).
# If a model's shape drifts from its enforced contract, or any data test fails,
# this job goes red here - before it ever reaches a client's report.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Self-contained: dbt reads profiles.yml from the repo root.
      DBT_PROFILES_DIR: ${{ github.workspace }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-duckdb
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-duckdb==1.9.4"

      - name: dbt build (seed + run + test)
        run: dbt build

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: target/
          if-no-files-found: ignore
